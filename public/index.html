<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPO India — Live Upcoming &amp; Listed IPO Tracker with Investment Score</title>
  <meta name="description" content="Live Indian IPO tracker: upcoming, open and recently listed IPOs with subscription, fundamentals, valuation, listing dates and a 0-100 investability score." />
  <meta name="theme-color" content="#0a0d18" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3E%E2%82%B9%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    // set theme before first paint to avoid flash
    (function () {
      try {
        var t = localStorage.getItem('ipo-theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
  <script>
    // Site base path — supports GitHub Pages project subpaths (e.g. /ipo-india/)
    // as well as root hosting (workers.dev, `npm start`). Detail routes always
    // look like <base>/ipo/<id>, so stripping a trailing /ipo/... gives the base.
    (function () {
      var m = location.pathname.match(/^(.*?)(\/ipo\/.*)?$/);
      var b = m && m[1] ? m[1] : '/';
      if (b.charAt(b.length - 1) !== '/') b += '/';
      window.IPO_BASE = b;
      document.write('<link rel="stylesheet" href="' + b + 'styles.css" />');
    })();
  </script>

</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="/" class="brand" data-link>
        <span class="brand-mark">₹</span>
        <span class="brand-text">
          <span class="brand-name">IPO India</span>
          <span class="brand-sub">live tracker &amp; scorecard</span>
        </span>
      </a>
      <div class="topbar-right">
        <div class="live-pill" id="livePill" title="Data freshness">
          <span class="dot"></span><span id="liveText">connecting…</span>
        </div>
        <button class="icon-btn" id="themeBtn" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg class="ic-svg" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="themeIcon" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite">
    <div class="page-loading"><div class="spinner"></div></div>
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <p>
        Live data from public Chittorgarh feeds · auto-refreshed every 10 min ·
        Score = Demand 25 + Fundamentals 25 + Valuation 20 + Performance 15 + Sentiment 15.
      </p>
      <p class="foot-note"><b>Educational tool — not investment advice.</b> Verify in the RHP before applying.</p>
    </div>
  </footer>

  <script>
    // Load deployment config + app from the site base (root on workers.dev,
    // /<repo>/ on GitHub Pages). document.write keeps execution order intact.
    document.write(
      '<script src="' + window.IPO_BASE + 'config.js"><\/script>' +
      '<script src="' + window.IPO_BASE + 'app.js"><\/script>'
    );
  </script>
</body>
</html>
